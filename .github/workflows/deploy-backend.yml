name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /root/crminsurance-backend
            git pull origin master
            cd backend
            docker build -t crmbackend:latest .
            docker stop crmbackend || true
            docker rm crmbackend || true
            docker run -d --name crmbackend \
              --restart unless-stopped \
              -p 127.0.0.1:8080:4000 \
              --env-file .env \
              crmbackend:latest
            sleep 3
            curl -f http://127.0.0.1:8080/api/health
